name: Build Combined MIX TEST PDFMATCH
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: mix-test-pdfmatch-release
  cancel-in-progress: false
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install combined dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Restore large regression PDF fixtures
        shell: pwsh
        run: |
          Invoke-WebRequest "https://raw.githubusercontent.com/dincer552/pdf_kw_selector/dincer552-fix-github-updates/HKS_12.pdf" -OutFile "pdf_match/HKS_12.pdf"
          Invoke-WebRequest "https://raw.githubusercontent.com/dincer552/pdf_kw_selector/dincer552-fix-github-updates/HKS_17.pdf" -OutFile "pdf_match/HKS_17.pdf"
          Invoke-WebRequest "https://raw.githubusercontent.com/dincer552/pdf_kw_selector/dincer552-fix-github-updates/public/HKS_12.pdf" -OutFile "pdf_match/public/HKS_12.pdf"
      - name: Run PDF Match tests
        shell: pwsh
        run: |
          Push-Location pdf_match
          python -m pytest tests/test_status.py tests/test_motor_model_matching.py tests/test_grouped_tab_counts.py -q
          python -m py_compile status.py motor_compare.py desktop_app.py desktop_grouped_app.py coordinate_motor_discovery.py stage2_pdf_discovery.py pdf_master_scan.py
          python -c "import desktop_app; import desktop_grouped_app; import voclean_project_selector; from status import install_status_display; assert hasattr(desktop_grouped_app.GroupedApp, '_build_voclean_tab'); print('PDF Match source validation OK')"
          Pop-Location
      - name: Run TEST KONTROL tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Join-Path $PWD "test_kontrol")
          python -m pytest test_kontrol/test_app.py -q
      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q pdf_match test_kontrol launcher.py unified_updater.py
          python -c "import ast, pathlib; files=list(pathlib.Path('pdf_match').rglob('*.py'))+list(pathlib.Path('test_kontrol').rglob('*.py')); [ast.parse(p.read_text(encoding='utf-8-sig'), filename=str(p)) for p in files]; print(f'Parsed {len(files)} Python files')"
      - name: Write shared build metadata
        shell: pwsh
        env:
          APP_VERSION: v1.0.0.${{ github.run_number }}
        run: |
          Set-Content -Path mix_meta.py -Value @('"""Combined metadata."""',"BUILD_VERSION = `"$env:APP_VERSION`"","BUILD_SHA = `"$env:GITHUB_SHA`"") -Encoding UTF8
          Set-Content -Path pdf_match/build_info.py -Value @('"""PDF Match build metadata."""','import pdf_click_opener  # noqa: F401','import pdf_hover_indicator  # noqa: F401','import status  # noqa: F401','import button_label_fix  # noqa: F401','import voclean_project_selector  # noqa: F401',"BUILD_VERSION = `"$env:APP_VERSION`"","BUILD_SHA = `"$env:GITHUB_SHA`"") -Encoding UTF8
          Set-Content -Path test_kontrol/test_build_info.py -Value @('"""TEST KONTROL build metadata."""',"BUILD_VERSION = `"$env:APP_VERSION`"","BUILD_SHA = `"$env:GITHUB_SHA`"") -Encoding UTF8
      - name: Build PDF Match icon
        shell: pwsh
        run: |
          Push-Location pdf_match
          python build_icon.py
          Pop-Location
      - name: Build one combined EXE
        shell: pwsh
        env:
          APP_VERSION: v1.0.0.${{ github.run_number }}
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --paths pdf_match --paths test_kontrol --hidden-import desktop_grouped_app --hidden-import test_kontrol.app --hidden-import test_updater --hidden-import test_build_info --collect-all pypdf --collect-all tkinterdnd2 --icon pdf_match/AHU_Match.ico --add-data "pdf_match/AHU_Match.ico;." --add-data "test_kontrol/app_icon.png;." --add-data "test_kontrol/SYSR.ST.png;." --add-data "test_kontrol/SYSR.ST_BIG.png;." --name "Mix_Test_PDFMatch_$env:APP_VERSION" launcher.py
      - name: Smoke test combined EXE
        shell: pwsh
        env:
          APP_VERSION: v1.0.0.${{ github.run_number }}
        run: |
          $exe = Join-Path $PWD "dist/Mix_Test_PDFMatch_$env:APP_VERSION.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Combined EXE missing" }
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) { throw "Combined EXE exited early: $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
      - name: Prepare release assets
        shell: pwsh
        env:
          APP_VERSION: v1.0.0.${{ github.run_number }}
        run: |
          $source = "dist/Mix_Test_PDFMatch_$env:APP_VERSION.exe"
          Copy-Item $source dist/Mix_Test_PDFMatch_latest.exe
          Copy-Item $source "dist/Mix_Test_PDFMatch_$env:GITHUB_SHA.exe"
          (Get-FileHash "dist/Mix_Test_PDFMatch_latest.exe" -Algorithm SHA256).Hash.ToLower() | Set-Content dist/Mix_Test_PDFMatch_latest.sha256 -NoNewline
      - name: Publish the single release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: v1.0.0.${{ github.run_number }}
        shell: bash
        run: |
          notes="Version: $APP_VERSION
          Build: $GITHUB_SHA
          Combined AHU Match + TEST KONTROL application."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/Mix_Test_PDFMatch_latest.exe dist/Mix_Test_PDFMatch_latest.sha256 "dist/Mix_Test_PDFMatch_${GITHUB_SHA}.exe" --clobber
            gh release edit latest --title "MIX TEST PDFMATCH $APP_VERSION - Latest" --notes "$notes"
          else
            gh release create latest dist/Mix_Test_PDFMatch_latest.exe dist/Mix_Test_PDFMatch_latest.sha256 "dist/Mix_Test_PDFMatch_${GITHUB_SHA}.exe" --target "$GITHUB_SHA" --title "MIX TEST PDFMATCH $APP_VERSION - Latest" --notes "$notes"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Mix_Test_PDFMatch_Windows
          path: dist/Mix_Test_PDFMatch_v1.0.0.${{ github.run_number }}.exe
